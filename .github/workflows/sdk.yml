name: Browser SDK contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium firefox
      - run: python tests/model_readers_browser_test.py
      - run: cargo test --locked --manifest-path sandbox/Cargo.toml
      - run: node tools/build_workbench.mjs
      - run: python tests/workbench_browser_test.py --runtime web
      - run: python tests/preview_browser_test.py --runtime web
      - run: python tests/chat_development_browser_test.py --runtime web
      - name: Check the actual module worker with a no-GPU protocol fixture
        run: python tests/sdk_browser_test.py --runtime web --chromium
