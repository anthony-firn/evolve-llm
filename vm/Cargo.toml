[package]
name = "evolve-vm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A kernel compiled to WebAssembly that runs WebAssembly (WASI) programs as processes: files, pipes, terminals and a shell, in the browser."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
