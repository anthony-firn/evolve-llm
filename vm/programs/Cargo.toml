[package]
name = "evolve-programs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The shell and core utilities of the Evolve VM, as WASI programs."

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde_json = "1"
base64 = "0.22"
sha1_smol = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
