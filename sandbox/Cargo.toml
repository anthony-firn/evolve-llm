[package]
name = "evolve-shell"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bounded browser-only shell utilities and virtual filesystem for Evolve LLM"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = false
