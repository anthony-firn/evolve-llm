[package]
name = "evolve-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Wisp v1 relay for Evolve Browser: forwards encrypted TCP bytes between the in-browser engine and public servers"

[[bin]]
name = "evolve-relay"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "connect", "__rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Nostr announcements (--announce): BIP-340 signatures, NIP-01 event ids, TLS to Nostr relays
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std", "precomputed-tables"] }
sha2 = "0.10"
serde_json = "1"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
