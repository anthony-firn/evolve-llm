# Vendored from https://github.com/ethereum/webtor-rs (MIT), commit a2432984ee657fec6905269cdfeb013254ef2c26,
# crate `webtor` 0.5.7. Changes for Evolve Browser are listed in ../README.md.
[package]
name = "webtor"
version = "0.5.7"
edition = "2021"
license = "MIT"
description = "Tor client for web browsers (vendored for Evolve Browser)"
publish = false

[dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
futures = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tor-rtcompat = { version = "0.37.0", default-features = false }
tor-proto = { version = "0.37.0", default-features = false }
tor-protover = "0.37.0"
tor-units = "0.37.0"
tor-netdoc = { version = "0.37.0", default-features = false }
tor-linkspec = "0.37.0"
tor-llcrypto = "0.37.0"
tor-cell = "0.37.0"
tor-error = "0.37.0"
tor-async-utils = "0.37.0"
tor-memquota = "0.37.0"
tor-checkable = "0.37.0"
rsa = "0.9"
x25519-dalek = "2.0"
ed25519-dalek = "2.0"
chacha20poly1305 = "0.10"
sha1 = "0.10"
sha3 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2.5"
http = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
brotli = "7.0"
uuid = { version = "1.0", features = ["v4", "js"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
httparse = "1.10.1"
kcp = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.69", features = ["console", "WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "BinaryType", "Blob", "FileReader", "Response", "Request", "Headers", "RequestInit", "RequestMode", "Performance", "Crypto", "SubtleCrypto", "RtcPeerConnection", "RtcPeerConnectionIceEvent", "RtcIceCandidate", "RtcIceCandidateInit", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcSdpType", "RtcConfiguration", "RtcIceServer", "RtcDataChannel", "RtcDataChannelEvent", "RtcDataChannelInit", "RtcDataChannelState", "RtcIceConnectionState", "RtcIceGatheringState", "RtcSignalingState", "RtcDataChannelType"] }
subtle-tls = { path = "../subtle-tls" }
async-trait = "0.1"
getrandom = { version = "0.2", features = ["js"] }
